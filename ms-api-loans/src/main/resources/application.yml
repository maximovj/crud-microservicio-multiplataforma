spring:
  application:
    name: api-ms-loans
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:oracleuser/oraclepassword@//localhost:1521/XEPDB1}
    username: ${DB_USERNAME:oracleuser}
    password: ${DB_PASSWORD:oraclepassword}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
  
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_MODE:update}
    show-sql: ${DB_LOGGIN_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

server:
  port: ${PORT:8007}